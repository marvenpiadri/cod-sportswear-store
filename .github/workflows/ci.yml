name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify storefront assets
        run: test -f dist/store/browser/index.html
      - name: Typecheck and validate Worker deployment
        run: |
          cd worker
          npm install
          npm run typecheck
          npx wrangler deploy --dry-run --config ../wrangler.toml
